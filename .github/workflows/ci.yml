name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          # Minimal env so modules load without real credentials
          LLM_BACKEND: anthropic
          ANTHROPIC_API_KEY: test-key
          NOTES_DOC_ID: test-id
          AGENDAS_DOC_ID: test-id
          OUTPUT_FOLDER_ID: test-id
          GMAIL_LABEL: committee
          COMMITTEE_EMAILS: test@example.com

  # Integration tests run manually (see tests/integration/test_pipeline.py)
  # Trigger with: INTEGRATION_TESTS=1 pytest tests/integration/ -v -s
