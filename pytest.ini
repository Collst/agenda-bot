[pytest]
# Discover tests in the tests/ directory
testpaths = tests

# Show short traceback by default; use -v for verbose
addopts = --tb=short

# asyncio mode for any async tests added later
asyncio_mode = auto

# Markers (suppresses PytestUnknownMarkWarning)
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (require live Google credentials and INTEGRATION_TESTS=1)
